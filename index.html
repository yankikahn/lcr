<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LCR Orlando Access</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0D1B3E;
  --navy-mid: #1A3A6B;
  --navy-soft: #E8EEF8;
  --red: #C0392B;
  --gold: #C8830A;
  --white: #FFFFFF;
  --bg: #F4F6FB;
  --border: #DDE3F0;
  --text: #0D1B3E;
  --text-soft: #6F7E9D;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  min-height: 100vh;
  font-family: 'Plus Jakarta Sans', sans-serif;
  background:
    radial-gradient(circle at top left, rgba(200,131,10,0.10), transparent 30%),
    linear-gradient(135deg, #f7f1ea 0%, var(--bg) 45%, #eef3ff 100%);
  color: var(--text);
  display: grid;
  place-items: center;
  padding: 24px;
}

.shell {
  width: 100%;
  max-width: 520px;
  background: rgba(255,255,255,0.92);
  border: 1px solid rgba(221,227,240,0.95);
  border-radius: 22px;
  box-shadow: 0 28px 80px rgba(13,27,62,0.14);
  overflow: hidden;
}

.band {
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
  padding: 24px 28px;
  border-bottom: 3px solid var(--red);
}

.eyebrow {
  display: inline-block;
  font-family: 'Rajdhani', sans-serif;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  font-size: 12px;
  font-weight: 700;
  color: rgba(255,255,255,0.65);
  margin-bottom: 10px;
}

.band h1 {
  font-family: 'Rajdhani', sans-serif;
  font-size: 34px;
  line-height: 0.95;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--white);
}

.band p {
  margin-top: 10px;
  font-size: 13px;
  color: rgba(255,255,255,0.65);
}

.panel {
  padding: 28px;
}

.panel p {
  color: var(--text-soft);
  font-size: 15px;
  line-height: 1.6;
}

.form {
  margin-top: 22px;
}

.label {
  display: block;
  margin-bottom: 10px;
  font-family: 'Rajdhani', sans-serif;
  font-size: 13px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text);
}

.row {
  display: flex;
  gap: 10px;
}

.code {
  flex: 1;
  width: 100%;
  border: 1.5px solid var(--border);
  border-radius: 12px;
  padding: 14px 16px;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: 0.32em;
  text-align: center;
  color: var(--navy);
  background: var(--white);
}

.code:focus {
  outline: none;
  border-color: var(--navy-mid);
  box-shadow: 0 0 0 4px rgba(26,58,107,0.10);
}

.btn {
  border: none;
  border-radius: 12px;
  padding: 0 18px;
  min-width: 118px;
  background: var(--gold);
  color: var(--white);
  font-family: 'Rajdhani', sans-serif;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
  transition: transform .15s ease, opacity .15s ease;
}

.btn:hover { transform: translateY(-1px); }
.btn:active { transform: translateY(0); }

.msg {
  min-height: 22px;
  margin-top: 14px;
  font-size: 13px;
  font-weight: 600;
}

.msg.error { color: var(--red); }
.msg.ok { color: #1A7A4A; }

.foot {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-soft);
}

@media (max-width: 560px) {
  .band h1 { font-size: 28px; }
  .panel { padding: 22px; }
  .row { flex-direction: column; }
  .btn { height: 52px; }
}
</style>
</head>
<body>
  <main class="shell">
    <section class="band">
      <span class="eyebrow">Member Access</span>
      <h1>LCR Orlando</h1>
      <p>2026 Political Issues Survey Results</p>
    </section>

    <section class="panel">
      <p>Enter the 4-digit access code to continue to the survey dashboard.</p>

      <form class="form" id="gate-form">
        <label class="label" for="access-code">Access Code</label>
        <div class="row">
          <input
            class="code"
            id="access-code"
            name="access-code"
            type="password"
            inputmode="numeric"
            maxlength="4"
            autocomplete="off"
            placeholder="0000"
            aria-describedby="gate-message"
          >
          <button class="btn" type="submit">Continue</button>
        </div>
        <div class="msg" id="gate-message" aria-live="polite"></div>
      </form>

      <div class="foot">This gate is for lightweight access control only and should not be treated as a secure authentication system.</div>
    </section>
  </main>

<script>
var ACCESS_CODE = '4729';
var TARGET_PATH = './vault-4729-x9k2m7q4v1r8a6b3/';
var form = document.getElementById('gate-form');
var input = document.getElementById('access-code');
var message = document.getElementById('gate-message');

function setMessage(text, kind) {
  message.textContent = text;
  message.className = 'msg' + (kind ? ' ' + kind : '');
}

form.addEventListener('submit', function (event) {
  event.preventDefault();
  var code = (input.value || '').trim();

  if (code.length !== 4) {
    setMessage('Enter all four digits.', 'error');
    input.focus();
    return;
  }

  if (code !== ACCESS_CODE) {
    setMessage('Incorrect code. Try again.', 'error');
    input.select();
    return;
  }

  sessionStorage.setItem('lcr_gate_passed', 'true');
  setMessage('Access granted. Redirecting…', 'ok');
  window.location.href = TARGET_PATH;
});
</script>
</body>
</html>
